# Crucible on one machine: PostgreSQL, the API, and Caddy in front.
# Install guide: README.md in this folder. Hub sign-in: compose.hub.yaml.

name: crucible

x-api: &api
  image: crucible-api:local
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  environment: &api-environment
    DB_SERVER: db:5432
    DB_USERNAME: crucible
    DB_DATABASE: crucible
    API_PUBLIC_URL: ${CRUCIBLE_PUBLIC_URL:-http://localhost:${CRUCIBLE_HTTP_PORT:-8080}}
    API_PATH: api/v3
    ALEMBIC_PRODUCTION_DATABASE: ""
  secrets:
    - PGDB_PW
    - CRUCIBLE_SECRET_KEY

services:
  db:
    image: pgvector/pgvector:0.8.1-pg17
    # The entrypoint switches to the postgres user and owns the data folder, so only NET_RAW goes.
    cap_drop: [NET_RAW]
    security_opt: [no-new-privileges:true]
    networks: [backend]
    environment:
      POSTGRES_DB: crucible
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
    secrets:
      - POSTGRES_PASSWORD
      - PGDB_PW
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      # Over TCP, so the temporary server PostgreSQL runs during its first initialization does not
      # count, and only once the init script has created the application role.
      test: ["CMD-SHELL", "pg_isready --host 127.0.0.1 --username postgres --dbname crucible && psql --username postgres --dbname crucible --tuples-only --no-align --command \"select 1 from pg_roles where rolname = 'crucible'\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *api
    pull_policy: never
    command: ["python", "-m", "app.cli", "db", "upgrade"]
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api
    build:
      context: ../..
    environment:
      <<: *api-environment
      PORT: "8000"
      WEB_CONCURRENCY: ${CRUCIBLE_API_WORKERS:-2}
      # Only the proxy and the Hub can reach this service, so forwarding headers are trusted.
      FORWARDED_ALLOW_IPS: "*"
    networks: [backend, crucible]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  proxy:
    image: caddy:2.11.7-alpine
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    networks: [crucible]
    environment:
      CRUCIBLE_SITE_ADDRESS: ${CRUCIBLE_SITE_ADDRESS:-:80}
      CRUCIBLE_HUB_UPSTREAM: ${CRUCIBLE_HUB_UPSTREAM:-}
    ports:
      - "${CRUCIBLE_HTTP_PORT:-8080}:80"
      - "${CRUCIBLE_HTTPS_PORT:-8443}:443"
      - "${CRUCIBLE_HTTPS_PORT:-8443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

secrets:
  POSTGRES_PASSWORD:
    file: ./secrets/POSTGRES_PASSWORD
  PGDB_PW:
    file: ./secrets/PGDB_PW
  CRUCIBLE_SECRET_KEY:
    file: ./secrets/CRUCIBLE_SECRET_KEY

networks:
  # The database and the migration job only; no outside access.
  backend:
    internal: true
  # Shared with the Hub when it runs on this machine (its project joins this network by name).
  crucible:
    name: ${CRUCIBLE_NETWORK:-crucible}

volumes:
  db-data:
  caddy-data:
  caddy-config:
