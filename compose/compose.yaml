# Crucible on one machine: PostgreSQL, the API, SeaweedFS for files, and Caddy in front.
# Install guide: README.md in this folder. Hub sign-in: compose.hub.yaml.

name: crucible

x-api: &api
  image: crucible-api:local
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  read_only: true
  tmpfs: [/tmp]
  environment: &api-environment
    DB_SERVER: db:5432
    DB_USERNAME: crucible
    DB_DATABASE: crucible
    API_PUBLIC_URL: ${CRUCIBLE_PUBLIC_URL:-http://localhost:${CRUCIBLE_HTTP_PORT:-8080}}
    API_PATH: api/v3
    ALEMBIC_PRODUCTION_DATABASE: ""
    # Passwords are for small installations; an institution turns them off and lists its own
    # sign-in provider (see README.md). People are added by an administrator unless registration
    # is set to approval.
    CRUCIBLE_AUTH_PASSWORD_ENABLED: ${CRUCIBLE_AUTH_PASSWORD_ENABLED:-true}
    CRUCIBLE_AUTH_PASSWORD_REGISTRATION: ${CRUCIBLE_AUTH_PASSWORD_REGISTRATION:-closed}
    CRUCIBLE_AUTH_PEPPER_ID: ${CRUCIBLE_AUTH_PEPPER_ID:-one}
    # People are found by their recorded logins, which also lets them add another way to sign in.
    # Only an installation upgraded from 3.x whose people sign in with ORCID sets this to false
    # until it has run the user_identity backfill (see Upgrading in README.md).
    CRUCIBLE_AUTH_IDENTITY_LOOKUP: ${CRUCIBLE_AUTH_IDENTITY_LOOKUP:-true}
    # The programs that may sign people in. The nano-crucible command line needs no secret;
    # compose.hub.yaml adds the Hub.
    CRUCIBLE_AUTH_CLIENTS: >-
      [{"key": "nanocrucible",
        "client_id": "nano-crucible",
        "display_name": "nano-crucible",
        "type": "public",
        "redirect_uris": ["http://127.0.0.1/callback", "http://[::1]/callback"]}]
  secrets:
    - PGDB_PW
    - CRUCIBLE_SECRET_KEY
    - CRUCIBLE_AUTH_PEPPER

# Storage settings shared by the API and the cleanup job.
x-storage-environment: &storage-environment
  STORAGE_BACKEND: ${CRUCIBLE_STORAGE_BACKEND:-s3}
  S3_ENDPOINT_URL: ${CRUCIBLE_S3_ENDPOINT_URL:-http://seaweedfs:8333}
  # Signed upload and download URLs carry this address, so clients must reach it.
  S3_PUBLIC_URL: ${CRUCIBLE_S3_PUBLIC_URL:-${CRUCIBLE_PUBLIC_URL:-http://localhost:${CRUCIBLE_HTTP_PORT:-8080}}}
  S3_REGION: ${CRUCIBLE_S3_REGION:-us-east-1}
  UPLOAD_BUCKET: ${CRUCIBLE_UPLOAD_BUCKET:-crucible-files}
  RECORD_BUCKET: ${CRUCIBLE_RECORD_BUCKET:-crucible-records}
  MULTIPART_UPLOAD_ENABLED: "true"
  MULTIPART_UPLOAD_BUCKET: ${CRUCIBLE_UPLOAD_BUCKET:-crucible-files}
  FILE_VERSION_RETENTION_DAYS: ${CRUCIBLE_FILE_VERSION_RETENTION_DAYS:-14}
  STORAGE_CLEANUP_ENABLED: ${CRUCIBLE_STORAGE_CLEANUP_ENABLED:-true}

services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    # The entrypoint switches to the postgres user and owns the data folder, so only NET_RAW goes.
    cap_drop: [NET_RAW]
    security_opt: [no-new-privileges:true]
    networks: [backend]
    environment:
      POSTGRES_DB: crucible
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
    secrets:
      - POSTGRES_PASSWORD
      - PGDB_PW
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      # Over TCP, so the temporary server PostgreSQL runs during its first initialization does not
      # count, and only once the init script has created the application role.
      test: ["CMD-SHELL", "pg_isready --host 127.0.0.1 --username postgres --dbname crucible && psql --username postgres --dbname crucible --tuples-only --no-align --command \"select 1 from pg_roles where rolname = 'crucible'\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *api
    pull_policy: never
    command: ["python", "-m", "app.cli", "db", "upgrade"]
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api
    build:
      context: ../..
    environment:
      <<: [*api-environment, *storage-environment]
      PORT: "8000"
      WEB_CONCURRENCY: ${CRUCIBLE_API_WORKERS:-2}
      # Only the proxy and the Hub can reach this service, so forwarding headers are trusted.
      FORWARDED_ALLOW_IPS: "*"
    secrets:
      - PGDB_PW
      - CRUCIBLE_SECRET_KEY
      - CRUCIBLE_AUTH_PEPPER
      - S3_ACCESS_KEY_ID
      - S3_SECRET_ACCESS_KEY
    networks: [backend, crucible, storage]
    depends_on:
      migrate:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # Hourly: aborts expired uploads and deletes replaced file content past its grace period
  # (CRUCIBLE_STORAGE_CLEANUP_ENABLED=false turns it off).
  storage-cleanup:
    <<: *api
    pull_policy: never
    command: ["/bin/sh", "-c", "trap 'exit 0' TERM; while true; do python -m app.cli storage cleanup; sleep 3600 & wait $$!; done"]
    environment:
      <<: [*api-environment, *storage-environment]
    secrets:
      - PGDB_PW
      - CRUCIBLE_SECRET_KEY
      - S3_ACCESS_KEY_ID
      - S3_SECRET_ACCESS_KEY
    # crucible reaches a store outside the machine.
    networks: [backend, storage, crucible]
    depends_on:
      migrate:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
        required: false
    restart: unless-stopped

  # Hourly: removes expired sign-in records, sign-in history older than a year
  # (CRUCIBLE_AUTH_EVENT_RETENTION_DAYS), and accounts left waiting for approval 30 days.
  auth-cleanup:
    <<: *api
    pull_policy: never
    command: ["/bin/sh", "-c", "trap 'exit 0' TERM; while true; do python -m app.cli auth cleanup; sleep 3600 & wait $$!; done"]
    environment:
      <<: *api-environment
      CRUCIBLE_AUTH_EVENT_RETENTION_DAYS: ${CRUCIBLE_AUTH_EVENT_RETENTION_DAYS:-365}
    secrets:
      - PGDB_PW
    networks: [backend]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # File storage. Leave the bundled-storage profile out of COMPOSE_PROFILES to use another
  # S3-compatible store instead (README.md, "File storage").
  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    profiles: [bundled-storage]
    # The image's seaweed user, which owns /data in the image and so in a new volume.
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [storage]
    entrypoint:
      - /bin/sh
      - -c
      - export AWS_ACCESS_KEY_ID="$$(cat /run/secrets/S3_ACCESS_KEY_ID)" AWS_SECRET_ACCESS_KEY="$$(cat /run/secrets/S3_SECRET_ACCESS_KEY)" && exec /entrypoint.sh mini -dir=/data
    environment:
      S3_BUCKET: ${CRUCIBLE_UPLOAD_BUCKET:-crucible-files},${CRUCIBLE_RECORD_BUCKET:-crucible-records}
    secrets:
      - S3_ACCESS_KEY_ID
      - S3_SECRET_ACCESS_KEY
    volumes:
      # A Docker volume unless CRUCIBLE_FILES_DIR names a folder owned by uid 1000.
      - ${CRUCIBLE_FILES_DIR:-seaweedfs-data}:/data
    healthcheck:
      # Healthy once the S3 port answers and the buckets exist (the filer, port 8888, lists them).
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz && for bucket in $$(echo \"$$S3_BUCKET\" | tr , ' '); do wget -q -O /dev/null http://127.0.0.1:8888/buckets/$$bucket/ || exit 1; done"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # One-off: `docker compose run --rm files-backup backup` copies every bucket to the backup folder,
  # `restore` copies it back (README.md, "Backups"). Works with the bundled store or your own.
  files-backup:
    image: rclone/rclone:1.75.2
    profiles: [backup]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # storage reaches the bundled store; crucible reaches a store outside the machine.
    networks: [storage, crucible]
    entrypoint: ["/bin/sh", "/files-backup.sh"]
    command: ["backup"]
    depends_on:
      seaweedfs:
        condition: service_healthy
        required: false
    environment:
      RCLONE_CONFIG: /dev/null
      RCLONE_CONFIG_STORE_TYPE: s3
      RCLONE_CONFIG_STORE_PROVIDER: Other
      RCLONE_CONFIG_STORE_ENDPOINT: ${CRUCIBLE_S3_ENDPOINT_URL:-http://seaweedfs:8333}
      RCLONE_CONFIG_STORE_REGION: ${CRUCIBLE_S3_REGION:-us-east-1}
      RCLONE_CONFIG_STORE_FORCE_PATH_STYLE: "true"
      BUCKETS: ${CRUCIBLE_UPLOAD_BUCKET:-crucible-files} ${CRUCIBLE_RECORD_BUCKET:-crucible-records}
    secrets:
      - S3_ACCESS_KEY_ID
      - S3_SECRET_ACCESS_KEY
    volumes:
      - ./files-backup.sh:/files-backup.sh:ro,z
      - ${CRUCIBLE_BACKUP_DIR:-${HOME}/crucible-backups}/files:/backup
    restart: "no"

  proxy:
    image: caddy:2.11.7-alpine
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    networks: [crucible, storage]
    environment:
      CRUCIBLE_SITE_ADDRESS: ${CRUCIBLE_SITE_ADDRESS:-:80}
      CRUCIBLE_HUB_UPSTREAM: ${CRUCIBLE_HUB_UPSTREAM:-}
      CRUCIBLE_UPLOAD_BUCKET: ${CRUCIBLE_UPLOAD_BUCKET:-crucible-files}
      CRUCIBLE_HTTP_HOSTS: ${CRUCIBLE_HTTP_HOSTS:-}
    # Reachable from this machine only, unless CRUCIBLE_BIND_ADDRESS opens it to a network.
    ports:
      - "${CRUCIBLE_BIND_ADDRESS:-127.0.0.1}:${CRUCIBLE_HTTP_PORT:-8080}:80"
      - "${CRUCIBLE_BIND_ADDRESS:-127.0.0.1}:${CRUCIBLE_HTTPS_PORT:-8443}:443"
      - "${CRUCIBLE_BIND_ADDRESS:-127.0.0.1}:${CRUCIBLE_HTTPS_PORT:-8443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - ./local:/etc/caddy/local:ro,z
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

secrets:
  POSTGRES_PASSWORD:
    file: ./secrets/POSTGRES_PASSWORD
  PGDB_PW:
    file: ./secrets/PGDB_PW
  CRUCIBLE_SECRET_KEY:
    file: ./secrets/CRUCIBLE_SECRET_KEY
  CRUCIBLE_AUTH_PEPPER:
    file: ./secrets/CRUCIBLE_AUTH_PEPPER
  S3_ACCESS_KEY_ID:
    file: ./secrets/S3_ACCESS_KEY_ID
  S3_SECRET_ACCESS_KEY:
    file: ./secrets/S3_SECRET_ACCESS_KEY

networks:
  # The database and the migration job only; no outside access.
  backend:
    internal: true
  # Shared with the Hub when it runs on this machine (its project joins this network by name).
  crucible:
    name: ${CRUCIBLE_NETWORK:-crucible}
  # The bundled store, reached by the API and the proxy only.
  storage:
    internal: true

volumes:
  db-data:
  seaweedfs-data:
  caddy-data:
  caddy-config:
