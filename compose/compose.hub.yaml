# Sign-in through the Crucible Hub (ORCID), and for the nano-crucible command line. Add to COMPOSE_FILE in .env:
#   COMPOSE_FILE=compose.yaml:compose.hub.yaml
# Needs HTTPS (CRUCIBLE_PUBLIC_URL starting with https://) and an ORCID application; see README.md.

services:
  api:
    environment:
      HUB_AUTH_PUBLIC_API_URL: ${CRUCIBLE_PUBLIC_URL:?Set CRUCIBLE_PUBLIC_URL to the https:// address people use}/api/v3
      CRUCIBLE_AUTH_CLIENTS: >-
        [{"key": "hub",
          "client_id": "crucible-hub",
          "display_name": "Crucible Hub",
          "type": "confidential",
          "redirect_uris": ["${CRUCIBLE_PUBLIC_URL}/hub/auth/callback", "${CRUCIBLE_PUBLIC_URL}/hub/auth/link/callback"]},
         {"key": "nanocrucible",
          "client_id": "nano-crucible",
          "display_name": "nano-crucible",
          "type": "public",
          "redirect_uris": ["http://127.0.0.1/callback", "http://[::1]/callback"]}]
      ORCID_CLIENT_ID: ${ORCID_CLIENT_ID:?Set ORCID_CLIENT_ID from your ORCID application}
      ORCID_ISSUER: ${ORCID_ISSUER:-https://orcid.org}
      CRUCIBLE_AUTH_PROVIDERS: >-
        [{"key": "orcid",
          "display_name": "ORCID",
          "issuer": "${ORCID_ISSUER:-https://orcid.org}",
          "client_id": "${ORCID_CLIENT_ID:?Set ORCID_CLIENT_ID from your ORCID application}",
          "scopes": "openid",
          "token_endpoint_auth_method": "client_secret_post",
          "registration": "open",
          "legacy_callback": true}]
    secrets:
      - OAUTH_HUB_CLIENT_SECRET
      - ORCID_CLIENT_SECRET
      - OIDC_ORCID_CLIENT_SECRET

  proxy:
    environment:
      CRUCIBLE_HUB_UPSTREAM: ${CRUCIBLE_HUB_UPSTREAM:-hub:3000}

secrets:
  OAUTH_HUB_CLIENT_SECRET:
    file: ./secrets/HUB_AUTH_CLIENT_SECRET
  ORCID_CLIENT_SECRET:
    file: ./secrets/ORCID_CLIENT_SECRET
  OIDC_ORCID_CLIENT_SECRET:
    file: ./secrets/ORCID_CLIENT_SECRET
