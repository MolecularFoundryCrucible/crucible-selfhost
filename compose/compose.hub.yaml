# Sign-in through the Crucible Hub (ORCID). Add to COMPOSE_FILE in .env:
#   COMPOSE_FILE=compose.yaml:compose.hub.yaml
# Needs HTTPS (CRUCIBLE_PUBLIC_URL starting with https://) and an ORCID application; see README.md.

services:
  api:
    environment:
      HUB_AUTH_ENABLED: "true"
      HUB_AUTH_CALLBACK_URI: ${CRUCIBLE_PUBLIC_URL:?Set CRUCIBLE_PUBLIC_URL to the https:// address people use}/hub/auth/callback
      HUB_AUTH_PUBLIC_API_URL: ${CRUCIBLE_PUBLIC_URL}/api/v3
      ORCID_CLIENT_ID: ${ORCID_CLIENT_ID:?Set ORCID_CLIENT_ID from your ORCID application}
      HUB_AUTH_ORCID_ISSUER: ${ORCID_ISSUER:-https://orcid.org}
      ORCID_ISSUER: ${ORCID_ISSUER:-https://orcid.org}
    secrets:
      - HUB_AUTH_CLIENT_SECRET
      - ORCID_CLIENT_SECRET

  proxy:
    environment:
      CRUCIBLE_HUB_UPSTREAM: ${CRUCIBLE_HUB_UPSTREAM:-hub:3000}

secrets:
  HUB_AUTH_CLIENT_SECRET:
    file: ./secrets/HUB_AUTH_CLIENT_SECRET
  ORCID_CLIENT_SECRET:
    file: ./secrets/ORCID_CLIENT_SECRET
