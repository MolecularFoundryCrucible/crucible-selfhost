# The Crucible Hub, the web interface. Add to COMPOSE_FILE in .env:
#   COMPOSE_FILE=compose.yaml:compose.hub.yaml
# People sign in with a password, or through a provider such as ORCID (add compose.orcid.yaml).
# Anywhere but on this machine, the Hub needs HTTPS; see README.md.

services:
  api:
    environment:
      CRUCIBLE_AUTH_CLIENTS: >-
        [{"key": "hub",
          "client_id": "crucible-hub",
          "display_name": "Crucible Hub",
          "type": "confidential",
          "redirect_uris": ["${CRUCIBLE_PUBLIC_URL:-http://localhost:${CRUCIBLE_HTTP_PORT:-8080}}/hub/auth/callback", "${CRUCIBLE_PUBLIC_URL:-http://localhost:${CRUCIBLE_HTTP_PORT:-8080}}/hub/auth/link/callback"]},
         {"key": "nanocrucible",
          "client_id": "nano-crucible",
          "display_name": "nano-crucible",
          "type": "public",
          "redirect_uris": ["http://127.0.0.1/callback", "http://[::1]/callback"]}]
    secrets:
      - OAUTH_HUB_CLIENT_SECRET

  proxy:
    environment:
      CRUCIBLE_HUB_UPSTREAM: ${CRUCIBLE_HUB_UPSTREAM:-hub:3000}

secrets:
  OAUTH_HUB_CLIENT_SECRET:
    file: ./secrets/HUB_AUTH_CLIENT_SECRET
